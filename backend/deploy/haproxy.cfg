global
    log stdout format raw local0
    maxconn 256

defaults
    log global
    mode http
    option httplog
    option redispatch
    timeout connect 5s
    timeout client 620s
    timeout server 620s

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold nx 10s
    hold other 10s

frontend api_frontend
    bind :8000
    default_backend api_replicas

backend api_replicas
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    server-template api 4 api:8000 check resolvers docker init-addr libc,none inter 5s fall 3 rise 2
