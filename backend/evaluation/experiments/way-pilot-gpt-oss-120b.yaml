# Served through the Way gateway (OpenAI-compatible; LLM_BASE_URL / LLM_API_KEY in backend/.env).
# Way Free Tier: Rp 0 per token, so prices are 0 and max_cost_usd does not bind; check Way's
# Usage page after the pilot. Way's per-key limit is 60 RPM, hence concurrency 2.
# The key used must have TokenSaver off and no RAG collection bound (both rewrite the prompt).
# Pilot: 20 items per split, to confirm the served model, token use and that the prompt is untouched.
# jk_case is left out of the pilot; the full runs include it only after the owner confirms sending it to Way.
name: way-pilot-gpt-oss-120b
phase: "4a"
grader: inprocess
provider: openai_compatible
model: openai/gpt-oss-120b
context_mode: rag
temperature: null
datasets:
  engsaf: [dev, test]
  scientsbank: [dev, test_uq, test_ua]
repeats: 1
max_items_per_split: 20
price_in_per_mtok: 0.0
price_out_per_mtok: 0.0
concurrency: 2
requests_per_minute: 40
max_cost_usd: 1.0
overrides: {}
