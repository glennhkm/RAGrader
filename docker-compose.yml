services:
  ai-rag-grading-ta-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai_rag_grading_ta_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ANONYMIZED_TELEMETRY: ${ANONYMIZED_TELEMETRY:-false}
    ports:
      - "${API_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data:Z
      - ./logs:/app/logs:Z
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
