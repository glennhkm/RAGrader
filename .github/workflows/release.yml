name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0); must already exist"
        required: true
        type: string
      dry_run:
        description: "Build and verify only; do not publish a GitHub release"
        required: true
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate tag format
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' must match vMAJOR.MINOR.PATCH"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0

      - name: Tagged commit must be reachable from origin/main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::$TAG ($(git rev-parse --short HEAD)) is not reachable from origin/main"
            exit 1
          fi

      - name: Extract release notes
        run: ./scripts/release-notes.sh "${TAG#v}" > notes.md

      - name: Build plugin ZIPs
        run: |
          ./scripts/build-plugins.sh
          cd dist
          sha256sum ./*.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ env.TAG }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
            notes.md

      - name: Publish GitHub release
        if: ${{ env.DRY_RUN != 'true' }}
        run: |
          gh release create "$TAG" dist/*.zip dist/SHA256SUMS \
            --title "$TAG" --notes-file notes.md --verify-tag
