name: CI

on:
  # Feature branches are developed on several machines and pushed without a
  # pull request, so every branch push is verified, not only main.
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

# A newer push to the same branch or PR supersedes the running check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Release notes are extractable from CHANGELOG.md
        run: |
          notes="$(scripts/release-notes.sh 1.0.0)"
          echo "$notes" | grep -q mod_airagassign
          echo "$notes" | grep -q 1.2.0
          if scripts/release-notes.sh 9.9.9; then
            echo "::error::release-notes.sh must fail for a missing version"
            exit 1
          fi

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      # Fails if any test resolves or connects to a non-local host.
      - name: Run unit tests (network blocked)
        working-directory: backend
        run: python tests/run_offline.py -v

      - name: Byte-compile backend sources
        working-directory: backend
        run: python -m compileall -q src

      - name: Validate Docker Compose configuration
        working-directory: backend
        run: |
          cp .env.example .env
          cp .env.dev.example .env.dev
          docker compose config --quiet
          docker compose -f docker-compose.dev.yml --profile local config --quiet
          rm -f .env .env.dev

      - name: Build API image
        working-directory: backend
        run: docker build --tag ai-rag-grading-api:ci .

  # Brings up the production topology (HAProxy -> 2 API replicas -> Chroma HTTP
  # server + Redis) with a deterministic stub standing in for the LLM and the
  # embedding provider, then exercises it end to end.
  integration:
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # The tests import the backend (collection naming) and seed Chroma over HTTP.
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Start the compose stack
        working-directory: backend
        run: |
          set -o pipefail
          cp .env.example .env
          # The containers run as uid 10001; the bind-mounted data dirs must be writable.
          mkdir -p data/chroma_db data/uploads
          sudo chown -R 10001:10001 data/chroma_db data/uploads
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up -d --build --wait --wait-timeout 300 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Run integration tests
        working-directory: backend
        env:
          RAG_IT_URL: http://127.0.0.1:8000
          RAG_IT_TOKEN: ci-token
          RAG_IT_EXPECT_REPLICAS: "2"
        run: |
          set -o pipefail
          python -W ignore -m unittest discover -s integration_tests -v 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      # Job logs need a sign-in; annotations are public, so surface the log tails.
      - name: Annotate failure
        if: failure()
        working-directory: backend
        run: |
          annotate() {
            python3 -c "import sys,urllib.parse as u; print('::error title=$1::' + sys.stdin.read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
          }
          tail -c 3000 "$RUNNER_TEMP/ci.log" 2>/dev/null | annotate "integration test failure"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml logs --no-color --tail 25 2>&1 | tail -c 3500 | annotate "docker compose logs tail"
          docker compose -f docker-compose.yml -f docker-compose.ci.yml ps -a 2>&1 | tail -c 1500 | annotate "docker compose ps"

      - name: Tear down the compose stack
        if: always()
        working-directory: backend
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml down -v
          rm -f .env

  # The default image stays lean; make sure the optional local-embeddings layer
  # (fastembed) still builds and imports.
  image-local-extras:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build API image with local extras
        working-directory: backend
        run: |
          set -o pipefail
          docker build --build-arg INSTALL_LOCAL_EXTRAS=true --tag ai-rag-grading-api:local-extras . 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Verify fastembed imports
        run: |
          set -o pipefail
          docker run --rm ai-rag-grading-api:local-extras python -c "import fastembed" 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Annotate failure
        if: failure()
        run: |
          tail -n 40 "$RUNNER_TEMP/ci.log" 2>/dev/null | tail -c 3500 | python3 -c "import sys,urllib.parse as u; print('::error title=image-local-extras failure::' + sys.stdin.read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"

  moodle-plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"

      - name: Lint all Moodle plugin PHP files
        run: |
          find moodle-plugins -name "*.php" -print0 | xargs -0 -n1 php -l

      - name: Build and verify Moodle plugin ZIP packages
        run: |
          chmod +x scripts/build-plugins.sh
          ./scripts/build-plugins.sh
          test -f dist/airagassign.zip
          test -f dist/airagmaterial.zip
          test -f dist/local_assign_ai_rag.zip
          test -f dist/aiprovider_rag.zip


  # Installs each plugin into a real Moodle and runs its PHPUnit suite plus the
  # standard moodle-plugin-ci static checks. Coding-style and docblock checks are
  # informational until the legacy code base is cleaned up.
  moodle-plugin-ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      fail-fast: false
      matrix:
        moodle: [MOODLE_404_STABLE, MOODLE_405_STABLE, MOODLE_500_STABLE, MOODLE_503_STABLE]
        plugin: [mod_airagmaterial, mod_airagassign, local_assign_ai_rag, aiprovider_rag]
        # Moodle 4.4 covers the two activity modules only; the
        # Core AI subsystem plugins need 4.5+.
        exclude:
          - { moodle: MOODLE_404_STABLE, plugin: local_assign_ai_rag }
          - { moodle: MOODLE_404_STABLE, plugin: aiprovider_rag }
        # Entries matching an existing axis value add the PHP version to those legs.
        include:
          - { moodle: MOODLE_404_STABLE, php: "8.1" }
          - { moodle: MOODLE_405_STABLE, php: "8.1" }
          - { moodle: MOODLE_500_STABLE, php: "8.3" }
          - { moodle: MOODLE_503_STABLE, php: "8.3" }
    name: ${{ matrix.plugin }} (${{ matrix.moodle }}, PHP ${{ matrix.php }})
    env:
      MOODLE_BRANCH: ${{ matrix.moodle }}
      DB: pgsql
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: plugin

      # Moodle PHPUnit requires this locale.
      - name: Generate en_AU locale
        run: sudo locale-gen en_AU.UTF-8

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pgsql, zip, gd, xmlrpc, soap
          ini-values: max_input_vars=5000
          coverage: none

      - name: Install moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4.5
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"

      # Dependencies are installed from a directory holding only that plugin.
      - name: Prepare dependency plugin
        run: |
          mkdir -p "$RUNNER_TEMP/extra-plugins"
          case "${{ matrix.plugin }}" in
            mod_airagassign) dep=mod_airagmaterial ;;
            local_assign_ai_rag) dep=aiprovider_rag ;;
            *) dep="" ;;
          esac
          if [ -n "$dep" ]; then
            cp -r "plugin/moodle-plugins/$dep" "$RUNNER_TEMP/extra-plugins/$dep"
          fi
          echo "EXTRA_PLUGINS_DIR=$RUNNER_TEMP/extra-plugins" >> "$GITHUB_ENV"

      - name: Install Moodle and the plugin
        run: |
          set -o pipefail
          moodle-plugin-ci install --plugin ./plugin/moodle-plugins/${{ matrix.plugin }} --db-host=127.0.0.1 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: PHP lint
        run: |
          set -o pipefail
          moodle-plugin-ci phplint 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Validate plugin
        run: |
          set -o pipefail
          moodle-plugin-ci validate 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Check upgrade savepoints
        run: |
          set -o pipefail
          moodle-plugin-ci savepoints 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: PHPUnit
        run: |
          set -o pipefail
          moodle-plugin-ci phpunit --fail-on-warning 2>&1 | tee -a "$RUNNER_TEMP/ci.log"

      - name: Coding style (informational)
        continue-on-error: true
        run: moodle-plugin-ci codechecker --max-warnings 0

      - name: PHP docblocks (informational)
        continue-on-error: true
        run: moodle-plugin-ci phpdoc

      # Job logs need a sign-in; annotations are public, so surface the log tail.
      - name: Annotate failure
        if: failure()
        run: |
          tail -n 80 "$RUNNER_TEMP/ci.log" 2>/dev/null | python3 -c "import sys,urllib.parse as u; print('::error title=moodle-plugin-ci failure (${{ matrix.plugin }} ${{ matrix.moodle }})::' + sys.stdin.read().replace('%','%25').replace('\r','%0D').replace('\n','%0A'))"
